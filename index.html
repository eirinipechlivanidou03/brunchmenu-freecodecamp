<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fili menu</title>
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="menu">
      <main>
        <h1>fili menu</h1>
        <p class="established">Est. 2024</p>
        <hr />

        <section>
          <h2>coffee</h2>
          
          <article class="item">
            <p class="flavor">freddo espresso</p><p class="price">3.00</p>
          </article>
          <article class="item">
            <p class="flavor">caramel macchiato</p><p class="price">3.75</p>
          </article>
          <article class="item">
            <p class="flavor">freddo cappuccino</p><p class="price">3.50</p>
          </article>
          <article class="item">
            <p class="flavor">hazelnut</p><p class="price">4.00</p>
          </article>
          <article class="item">
            <p class="flavor">mocha</p><p class="price">4.50</p>
          </article>
        </section>

        <section>
          <h2>brunch</h2>
          
          <article class="item">
            <p class="dessert">avocado toast & poached egg</p><p class="price">7.50</p>
          </article>
          <article class="item">
            <p class="dessert">eggs benedict</p><p class="price">8.50</p>
          </article>
          <article class="item">
            <p class="dessert">truffle scrambled eggs</p><p class="price">8.00</p>
          </article>
          <article class="item">
            <p class="dessert">greek breakfast bowl</p><p class="price">7.00</p>
          </article>
        </section>
      </main>

      <hr class="bottom-line" />

      <footer>
        <address>
          <p>
            <a href="https://www.freecodecamp.org" target="_blank">Visit our website</a>
          </p>
          <p class="address">Thessaloniki, Greece</p>
        </address>
      </footer>
    </div>
  </body>
</html>
